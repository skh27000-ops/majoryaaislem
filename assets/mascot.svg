<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" role="img" aria-label="Mascotte MAJORY : un cerveau en blouse médicale avec stéthoscope, marteau à réflexes et seringue">
<style>
.m-bob{animation:m-bob 3.2s ease-in-out infinite}
.m-hammer{transform-origin:92px 338px;animation:m-hammer 2.4s ease-in-out infinite}
.m-eye{transform-box:fill-box;transform-origin:center;animation:m-blink 5s infinite}
.m-twinkle{transform-box:fill-box;transform-origin:center;animation:m-twinkle 2.8s ease-in-out infinite}
@keyframes m-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes m-hammer{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes m-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes m-twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.35) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){.m-bob,.m-hammer,.m-eye,.m-twinkle{animation:none}}
</style>
<!-- décor -->
<g stroke="#1A1626" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
  <path class="m-twinkle" d="M42 118v30M27 133h30" stroke="#1A1626" fill="none"/>
  <path class="m-twinkle" style="animation-delay:-1.2s" d="M382 96v24M370 108h24" fill="none"/>
  <circle cx="58" cy="330" r="7" fill="#FFD25A"/>
  <circle cx="376" cy="250" r="6" fill="#5BC8F0"/>
</g>
<ellipse cx="220" cy="462" rx="112" ry="11" fill="#1A1626" opacity=".12"/>
<g class="m-bob">
<g transform="translate(10 8)" stroke="#1A1626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <!-- jambes + sabots -->
  <rect x="150" y="388" width="44" height="42" rx="12" fill="#5BC8F0"/>
  <rect x="206" y="388" width="44" height="42" rx="12" fill="#5BC8F0"/>
  <path d="M138 438c0-14 14-18 32-18s30 4 30 18c0 6-6 8-30 8s-32-2-32-8z" fill="#FF9466"/>
  <path d="M200 438c0-14 14-18 32-18s30 4 30 18c0 6-6 8-30 8s-32-2-32-8z" fill="#FF9466"/>
  <!-- buste / blouse -->
  <path d="M145 245C140 280 135 340 142 396L258 396C265 340 260 280 255 245C235 258 165 258 145 245Z" fill="#5BC8F0"/>
  <path d="M168 250L200 292L232 250Z" fill="#FAF6F3"/>
  <path d="M212 322h36v34a5 5 0 0 1-5 5h-26a5 5 0 0 1-5-5z" fill="#8ADBF7"/>
  <rect x="219" y="303" width="8" height="26" rx="3" fill="#FFD25A" stroke-width="3"/>
  <rect x="232" y="309" width="7" height="20" rx="3" fill="#FF9466" stroke-width="3"/>
  <!-- stéthoscope -->
  <path d="M164 247C146 300 166 340 192 342M236 247C254 300 234 340 208 342" fill="none" stroke-width="5.5"/>
  <circle cx="200" cy="352" r="14" fill="#FFD25A"/>
  <circle cx="200" cy="352" r="5" fill="#FF9466" stroke-width="3"/>
  <!-- bras gauche + marteau -->
  <g class="m-hammer">
    <path d="M92 338L64 274" stroke-width="13" fill="none"/>
    <path d="M92 338L64 274" stroke="#FFD25A" stroke-width="6" fill="none"/>
    <rect x="-22" y="-12" width="44" height="24" rx="12" fill="#FF9466" transform="translate(60 266) rotate(-25)"/>
  </g>
  <path d="M150 276C122 283 101 303 92 334" stroke-width="35" fill="none"/>
  <path d="M150 276C122 283 101 303 92 334" stroke="#5BC8F0" stroke-width="27" fill="none"/>
  <circle cx="92" cy="340" r="15" fill="#FAF6F3"/>
  <!-- bras droit + seringue -->
  <path d="M250 276C278 283 299 303 308 334" stroke-width="35" fill="none"/>
  <path d="M250 276C278 283 299 303 308 334" stroke="#5BC8F0" stroke-width="27" fill="none"/>
  <g transform="translate(295 367) rotate(22)">
    <path d="M0 -98V-78" stroke-width="3.5"/>
    <rect x="-5" y="-80" width="10" height="8" rx="2" fill="#FAF6F3" stroke-width="3"/>
    <rect x="-9" y="-72" width="18" height="58" rx="4" fill="#FAF6F3"/>
    <rect x="-5" y="-52" width="10" height="30" rx="2" fill="#FFD25A" stroke-width="0"/>
    <path d="M-9 -62h5M-9 -50h5M-9 -38h5" stroke-width="2.5"/>
    <path d="M0 -14V6" stroke-width="4"/>
    <rect x="-14" y="4" width="28" height="7" rx="3.5" fill="#FAF6F3" stroke-width="3.5"/>
    <circle cx="0" cy="-34" r="15" fill="#FAF6F3"/>
  </g>
  <!-- cerveau -->
  <path d="M120 215C80 220 55 185 72 155C52 130 70 92 105 90C110 55 160 38 188 62C205 40 262 42 275 82C318 78 345 118 328 148C350 178 330 222 285 218C270 236 235 240 215 226C190 242 150 238 120 215Z" fill="#C9A9F2"/>
  <g fill="none" stroke="#A07BE3" stroke-width="4.5">
    <path d="M190 64C182 84 200 96 192 114"/>
    <path d="M100 122C115 112 125 126 140 118"/>
    <path d="M86 166C100 158 108 172 122 165"/>
    <path d="M150 78C158 90 172 86 176 98"/>
    <path d="M230 76C240 90 256 84 262 98"/>
    <path d="M298 122C284 112 272 126 258 118"/>
    <path d="M314 166C298 158 290 172 276 165"/>
  </g>
  <path d="M92 112C100 94 118 84 138 84" fill="none" stroke="#DCC8F8" stroke-width="6"/>
  <circle cx="126" cy="193" r="12" fill="#FF9466" opacity=".55" stroke="none"/>
  <circle cx="274" cy="193" r="12" fill="#FF9466" opacity=".55" stroke="none"/>
  <path d="M142 133Q160 123 178 131M222 131Q240 123 258 133" fill="none" stroke-width="4.5"/>
  <g class="m-eye"><ellipse cx="160" cy="162" rx="19" ry="21" fill="#fff" stroke-width="3.5"/><circle cx="163" cy="165" r="9.5" fill="#1A1626" stroke="none"/><circle cx="166" cy="161" r="3.2" fill="#fff" stroke="none"/></g>
  <g class="m-eye"><ellipse cx="240" cy="162" rx="19" ry="21" fill="#fff" stroke-width="3.5"/><circle cx="243" cy="165" r="9.5" fill="#1A1626" stroke="none"/><circle cx="246" cy="161" r="3.2" fill="#fff" stroke="none"/></g>
  <path d="M180 190Q200 218 220 190Z" fill="#1A1626"/>
  <path d="M190 203Q200 195 210 203Q200 212 190 203Z" fill="#FF9466" stroke="none"/>
</g>
</g>
</svg>
